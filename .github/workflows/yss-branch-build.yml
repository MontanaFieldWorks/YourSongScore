name: YSS branch build verification
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: TypeScript baseline check (informational while existing errors remain)
        run: npm run lint
        continue-on-error: true
      - name: Run regression tests
        run: |
          if ls tests/*.test.mjs >/dev/null 2>&1; then node --test tests/*.test.mjs; fi

      - name: Phase 2 residual vulnerability audit (branch-only)
        if: github.event_name == 'pull_request' && github.head_ref == 'security/phase2-build-deps-20261028'
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/phase2-audit.json
          audit_exit=$?
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit=JSON.parse(fs.readFileSync('/tmp/phase2-audit.json','utf8'));
          if(audit.error || !audit.vulnerabilities || !audit.metadata?.vulnerabilities) {
            console.error('Invalid audit response:', JSON.stringify(audit.error));
            process.exit(1);
          }
          console.log('PHASE2_AUDIT_COUNTS=' + JSON.stringify(audit.metadata.vulnerabilities));
          console.log('PHASE2_REMAINING=' + Object.entries(audit.vulnerabilities)
            .map(([name,v])=>name+':'+v.severity).join(', '));
          const targets=['vite','@babel/core','baseline-browser-mapping','brace-expansion','browserslist','nanoid','postcss','source-map-js'];
          for(const name of targets) {
            const vulnerability=audit.vulnerabilities[name];
            console.log('PHASE2_PATCH_TARGET='+JSON.stringify({name,status:vulnerability?'STILL_VULNERABLE':'RESOLVED',severity:vulnerability?.severity}));
            if(vulnerability) process.exitCode=1;
          }
          NODE
          if [ "$audit_exit" -gt 1 ]; then exit "$audit_exit"; fi
