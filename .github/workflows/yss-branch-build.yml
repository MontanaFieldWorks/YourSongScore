name: YSS branch build verification
on:
  push:
    branches:
      - fix-seo-display-hierarchy-20261015
      - experiment-low-frequency-balance-fallback-20261015
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/low-frequency-fallback.test.mjs
