name: YSS branch build verification
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Generate temporary advisory patch lockfile (Phase 3 only)
        if: github.event_name == 'pull_request' && github.head_ref == 'security/phase3-protobufjs-esbuild-20261028'
        shell: bash
        run: |
          npm update protobufjs esbuild --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const contents=fs.readFileSync('package-lock.json','utf8');
          const lock=JSON.parse(contents);
          console.log('PHASE3_LOCK_LENGTH='+contents.length);
          console.log('PHASE3_LOCK_SHA256='+crypto.createHash('sha256').update(contents).digest('hex'));
          const names=['protobufjs','esbuild','tsx/node_modules/esbuild','tsx','@grpc/proto-loader','firebase','@firebase/firestore','@grpc/grpc-js','exceljs','uuid'];
          for(const name of names) console.log('PHASE3_LOCK_VERSION='+name+':'+lock.packages['node_modules/'+name]?.version);
          for(let i=0;i<contents.length;i+=1800) console.log('PHASE3_LOCKPIECE:'+i+':'+JSON.stringify(contents.slice(i,i+1800)));
          console.log('PHASE3_LOCK_END='+contents.length);
          if(lock.packages['node_modules/protobufjs']?.version!=='7.6.5') throw Error('protobufjs not 7.6.5');
          const eb=lock.packages['node_modules/tsx/node_modules/esbuild']?.version;
          if(eb!=='0.28.1' && eb!=='0.28.2') throw Error('tsx esbuild not patched: '+eb);
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: TypeScript baseline check (informational while existing errors remain)
        run: npm run lint
        continue-on-error: true
      - name: Run regression tests
        run: |
          if ls tests/*.test.mjs >/dev/null 2>&1; then node --test tests/*.test.mjs; fi
